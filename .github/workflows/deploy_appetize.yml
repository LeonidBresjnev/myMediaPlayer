name: Build and Deploy to Appetize

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup vcpkg
        run: |
          # If vcpkg is not in the repo, clone it
          if [ ! -d "common/src/main/cpp/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git common/src/main/cpp/vcpkg
          fi
          cd common/src/main/cpp/vcpkg
          ./bootstrap-vcpkg.sh
          # Install dependencies defined in vcpkg.json
          ./vcpkg install --triplet arm64-android --x-manifest-root=..

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug \
            -Pandroid.builder.sdkDownload=true \
            -Pandroid.native.buildOutput=verbose \
            "-Pandroid.externalNativeBuild.cmake.arguments=-DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/common/src/main/cpp/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=arm64-android"

      - name: Upload to Appetize
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          # Find the debug APK
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found"
            exit 1
          fi
          
          echo "Found APK at $APK_PATH"
          
          if [ -z "$APPETIZE_PUBLIC_KEY" ]; then
            echo "No APPETIZE_PUBLIC_KEY found. Creating a new app on Appetize..."
            curl "https://$APPETIZE_API_TOKEN@api.appetize.io/v1/apps" \
              -F "file=@$APK_PATH" \
              -F "platform=android"
          else
            echo "Updating existing app $APPETIZE_PUBLIC_KEY on Appetize..."
            curl "https://$APPETIZE_API_TOKEN@api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY" \
              -F "file=@$APK_PATH" \
              -F "platform=android"
          fi
