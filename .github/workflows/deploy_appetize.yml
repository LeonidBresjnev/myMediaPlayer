name: Build, Test and Deploy

on:
  push:
    branches:
      - master

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    # Need kvm for emulator
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev \
            libxext-dev libxrender-dev libxrandr-dev libglu1-mesa-dev \
            libfreetype6-dev libcurl4-openssl-dev

      - name: Setup vcpkg
        run: |
          if [ ! -d "common/src/main/cpp/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git common/src/main/cpp/vcpkg
          fi
          cd common/src/main/cpp/vcpkg
          ./bootstrap-vcpkg.sh
          # Install both triplets needed for device (arm64) and emulator/appetize (x64)
          ./vcpkg install --triplet arm64-android --x-manifest-root=..
          ./vcpkg install --triplet x64-android --x-manifest-root=..
          
          # Clean up vcpkg build artifacts to save disk space for the emulator
          rm -rf buildtrees
          rm -rf packages
          df -h

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Integration Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.builder.sdkDownload=true \
            -Pandroid.native.buildOutput=verbose

      - name: Upload to Appetize
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          # Find the release APK
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found"
            exit 1
          fi
          
          echo "Found Release APK at $APK_PATH"
          
          if [ -z "$APPETIZE_PUBLIC_KEY" ]; then
            echo "No APPETIZE_PUBLIC_KEY found. Creating a new app on Appetize..."
            curl "https://$APPETIZE_API_TOKEN@api.appetize.io/v1/apps" \
              -F "file=@$APK_PATH" \
              -F "platform=android"
          else
            echo "Updating existing app $APPETIZE_PUBLIC_KEY on Appetize..."
            curl "https://$APPETIZE_API_TOKEN@api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY" \
              -F "file=@$APK_PATH" \
              -F "platform=android"
          fi
