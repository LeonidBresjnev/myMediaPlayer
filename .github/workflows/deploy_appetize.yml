name: Build and Deploy to Appetize

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload to Appetize
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          # Find the debug APK
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found"
            exit 1
          fi
          
          echo "Found APK at $APK_PATH"
          
          if [ -z "$APPETIZE_PUBLIC_KEY" ]; then
            echo "No APPETIZE_PUBLIC_KEY found. Creating a new app on Appetize..."
            curl "https://$APPETIZE_API_TOKEN@api.appetize.io/v1/apps" \
              -F "file=@$APK_PATH" \
              -F "platform=android"
          else
            echo "Updating existing app $APPETIZE_PUBLIC_KEY on Appetize..."
            curl "https://$APPETIZE_API_TOKEN@api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY" \
              -F "file=@$APK_PATH" \
              -F "platform=android"
          fi
